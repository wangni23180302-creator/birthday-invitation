<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9d1737">
  <title>小川，愿意和我赴约吗？</title>
  <meta name="description" content="9月27日，一起吃生日晚餐吧。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%239d1737'/%3E%3Cpath d='M32 52S10 39 10 23c0-12 15-16 22-5 7-11 22-7 22 5 0 16-22 29-22 29Z' fill='%23ffe6a7'/%3E%3C/svg%3E">
  <style>
    :root{--wine:#9d1737;--wine-dark:#681026;--gold:#efb747;--ink:#38131d;--cream:#fffaf0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
    body{min-height:100vh;background:linear-gradient(160deg,#fffaf0,#f9dce3);overflow:auto}.scene{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px 34px}.characters{display:block;width:min(920px,92vw);height:auto;max-height:58vh;object-fit:contain;border-radius:26px;box-shadow:0 20px 60px rgba(91,23,42,.13)}
    .panel{position:relative;z-index:2;width:min(500px,92vw);margin-top:-46px;padding:32px 30px 28px;text-align:center;background:rgba(255,253,248,.96);border:1px solid rgba(157,23,55,.16);border-radius:28px;box-shadow:0 22px 70px rgba(91,23,42,.18);backdrop-filter:blur(10px)}
    .date{display:inline-flex;align-items:center;gap:8px;color:var(--wine);font-size:.86rem;font-weight:800;letter-spacing:.12em}.date:before,.date:after{content:"";width:24px;height:1px;background:var(--gold)}
    h1{margin:15px 0 10px;font-family:Georgia,"Songti SC",serif;font-size:clamp(2rem,4vw,3.3rem);line-height:1.12;color:var(--wine)}.copy{margin:0 auto 24px;line-height:1.75;font-size:1rem}.copy strong{color:var(--wine)}.question{font-weight:900;font-size:1.13rem;margin:0 0 16px}
    .actions{position:relative;height:68px;display:flex;justify-content:center;align-items:flex-start;gap:14px}button{border:0;border-radius:14px;padding:14px 24px;font:inherit;font-weight:850;cursor:pointer;touch-action:manipulation;transition:transform .16s,box-shadow .16s,left .18s,top .18s}
    #yes{min-width:148px;background:var(--wine);color:white;box-shadow:0 7px 0 var(--wine-dark),0 12px 25px rgba(157,23,55,.25)}#yes:hover{transform:translateY(-2px)}#yes:active{transform:translateY(5px);box-shadow:0 2px 0 var(--wine-dark)}#no{min-width:110px;background:#eee7e1;color:#735c63;box-shadow:0 5px 0 #d6c9c5}
    .plea{min-height:26px;margin:2px 0 0;color:var(--wine);font-weight:850;opacity:0;transform:translateY(5px);transition:.25s}.plea.show{opacity:1;transform:none}.planner,.success{display:none}.planner h2,.success h2{font-family:Georgia,"Songti SC",serif;color:var(--wine);font-size:2.35rem;margin:5px 0 18px}.group{border:0;padding:0;margin:0 0 18px}.group legend{font-weight:850;margin-bottom:9px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.option{position:relative}.option input{position:absolute;opacity:0;pointer-events:none}.option span{display:block;padding:11px 8px;border:1px solid #e3c7ce;border-radius:12px;background:#fff;cursor:pointer;font-weight:700;transition:.18s}.option input:checked+span{background:#f9dce3;border-color:var(--wine);color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}.option input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}.confirm{width:100%;background:var(--wine);color:white;box-shadow:0 6px 0 var(--wine-dark)}.success .heart{font-size:4.6rem;line-height:1;animation:beat .8s ease-in-out infinite alternate}.success p{line-height:1.8;margin:0}.summary{margin-top:18px;padding:14px;border-radius:14px;background:#fae9ed;color:var(--wine);font-weight:800}
    .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:10;animation:fall 2.8s linear forwards}@keyframes beat{to{transform:scale(1.12)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
    @media(max-width:760px){.scene{min-height:100svh;justify-content:flex-start;padding:14px 12px 28px}.characters{width:100%;max-height:none;border-radius:20px}.panel{width:calc(100% - 20px);margin-top:-18px;padding:25px 20px 22px;border-radius:23px}.copy{font-size:.95rem}.actions{height:118px;gap:10px}h1{font-size:2.15rem}}
    @media(max-width:430px){.panel{background:rgba(255,253,248,.98)}button{padding:13px 18px}#yes{min-width:136px}#no{min-width:96px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="scene">
    <img class="characters" src="xiaoni-xiaochuan-separated.png" alt="小妮和小川的卡通形象">
    <section class="panel" aria-labelledby="title">
      <div id="invite">
        <div class="date">9 月 27 日 · 晚餐</div>
        <h1 id="title">小川，愿意和我赴约吗？</h1>
        <p class="copy">想请你一起吃饭，<br>认真地为你庆祝一次生日。</p>
        <p class="question">你的答案是——</p>
        <div class="actions" id="actions"><button id="yes" type="button">愿意 ♥</button><button id="no" type="button" aria-describedby="plea">不愿意</button></div>
        <p class="plea" id="plea" aria-live="polite">求求你去吧 🥺</p>
      </div>
      <form class="planner" id="planner">
        <h2>那就认真约起来</h2>
        <fieldset class="group"><legend>几点见面？</legend><div class="options">
          <label class="option"><input type="radio" name="time" value="晚上 6 点" checked><span>晚上 6 点</span></label>
          <label class="option"><input type="radio" name="time" value="晚上 7 点"><span>晚上 7 点</span></label>
          <label class="option"><input type="radio" name="time" value="晚上 8 点"><span>晚上 8 点</span></label>
          <label class="option"><input type="radio" name="time" value="时间由小妮定"><span>小妮定</span></label>
        </div></fieldset>
        <fieldset class="group"><legend>晚餐想吃什么？</legend><div class="options">
          <label class="option"><input type="radio" name="food" value="泰菜" checked><span>🌶️ 泰菜</span></label>
          <label class="option"><input type="radio" name="food" value="日料"><span>🍣 日料</span></label>
          <label class="option"><input type="radio" name="food" value="漂亮饭"><span>✨ 漂亮饭</span></label>
          <label class="option"><input type="radio" name="food" value="晚餐由小妮定"><span>小妮定</span></label>
        </div></fieldset>
        <button class="confirm" type="submit">确认赴约 ♥</button>
      </form>
      <div class="success" id="success" role="status" aria-live="polite"><div class="heart">💗</div><h2>约会成立！</h2><p><strong>9 月 27 日</strong>，带上好心情来赴约。<br>生日晚餐，小妮陪你一起过。</p><div class="summary" id="summary"></div></div>
    </section>
  </main>
  <script>
    const no=document.querySelector('#no'),yes=document.querySelector('#yes'),actions=document.querySelector('#actions'),plea=document.querySelector('#plea');let attempts=0;
    function escapeNo(){attempts++;plea.classList.add('show');no.style.position='absolute';const maxX=Math.max(0,actions.clientWidth-no.offsetWidth),maxY=Math.max(0,actions.clientHeight-no.offsetHeight);no.style.left=Math.random()*maxX+'px';no.style.top=Math.random()*maxY+'px';no.textContent=attempts>2?'再想想嘛':'不愿意'}
    ['pointerenter','pointerdown','touchstart','focus'].forEach(event=>no.addEventListener(event,e=>{e.preventDefault();escapeNo()},{passive:false}));no.addEventListener('click',e=>{e.preventDefault();escapeNo()});
    yes.addEventListener('click',()=>{document.querySelector('#invite').style.display='none';document.querySelector('#planner').style.display='block'});
    document.querySelector('#planner').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget),time=data.get('time'),food=data.get('food');document.querySelector('#planner').style.display='none';document.querySelector('#summary').textContent=`${time} · ${food}`;document.querySelector('#success').style.display='block';const colors=['#9d1737','#efb747','#ef829b','#ffffff'];if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<65;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}}});
  </script>
</body>
</html>
